version: '3.8'

services:
  web:
    image: node:20-alpine
    container_name: ciex-dashboard
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    environment:
      - NODE_ENV=development
